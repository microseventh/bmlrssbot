[package]
name = "bmlrssbot"
version = "0.1.0"
edition = "2021"
description = "Fetch RSS/Atom feeds and publish formatted articles to a Telegram channel."
license = "MIT"
repository = "https://github.com/microseventh/bmlrssbot"
readme = "README.md"
keywords = ["rss", "atom", "telegram", "bot", "docker"]

[dependencies]
anyhow = "1"
feed-rs = "2"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
